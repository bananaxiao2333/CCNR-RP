name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Fetch Corpse dependency (compileOnly)
        run: ./scripts/fetch-corpse.sh

      - name: Build with Gradle (incl. spotlessCheck)
        run: ./gradlew build --no-daemon

      - name: Run unit tests
        run: ./gradlew test -PrunTests --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccnr_rp
          path: build/libs/*.jar

      - name: Attach jar to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -E "^mod_version=" gradle.properties | cut -d= -f2)
          gh release upload "${GITHUB_REF_NAME}" "build/libs/ccnr_rp-${VERSION}.jar" --clobber
